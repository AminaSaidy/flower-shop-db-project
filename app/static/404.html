<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>404 - Page Not Found</title>
  <style>
    :root {
      --ink: #17211c;
      --muted: #6b7268;
      --primary: #c9e265;
      --sky: #e9ece4;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #fbfcfa;
      color: var(--ink);
      display: grid;
      place-items: center;
      min-height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 480px;
      padding: 32px;
    }
    h1 {
      font-size: 120px;
      margin: 0;
      line-height: 1;
      color: var(--primary);
    }
    h2 {
      font-size: 24px;
      margin: 16px 0 8px;
    }
    p {
      color: var(--muted);
      margin-bottom: 32px;
      line-height: 1.5;
    }
    a {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 99px;
      background: var(--primary);
      color: var(--ink);
      text-decoration: none;
      font-weight: 600;
      transition: opacity 0.2s;
    }
    a:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <h2>Oops, page not found</h2>
    <p>It seems the flower you're looking for has already bloomed elsewhere or this page never existed.</p>
    <a href="/">Return to home</a>
  </div>
</body>
</html>
